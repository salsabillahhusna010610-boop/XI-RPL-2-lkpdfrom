<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendaftaran Ekstrakurikuler</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="form-container">
        <h1>Pendaftaran Ekstrakurikuler</h1>
        <p>Silakan isi data diri dengan benar.</p>

        <form id="formPendaftaran">

            <!-- Nama Lengkap -->
            <label for="nama">Nama Lengkap</label>
            <input type="text" id="nama" placeholder="Masukkan nama lengkap">

            <!-- Email -->
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Masukkan email">

            <!-- Password -->
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Minimal 8 karakter">

            <!-- Konfirmasi Password -->
            <label for="konfirmasi">Konfirmasi Password</label>
            <input type="password" id="konfirmasi" placeholder="Masukkan password lagi">

            <!-- Ekstrakurikuler -->
            <label for="ekskul">Pilihan Ekstrakurikuler</label>
            <select id="ekskul">
                <option value="">-- Pilih Ekstrakurikuler --</option>
                <option value="Pramuka">Pramuka</option>
                <option value="PMR">PMR</option>
                <option value="Paskibra">Paskibra</option>
                <option value="Pencak Silat">Pencak Silat</option>
                <option value="Drumband">Drumband</option>
                <option value="Jurnalistik">Jurnalistik</option>
                <option value="Futsal">Futsal</option>
                <option value="Voly">Voly</option>
                <option value="Rohis">Rohis</option>
                <option value="Tari">Tari</option>
                <option value="Padus">Padus</option>
            </select>

            <button type="submit">Daftar</button>

            <!-- Pesan berhasil / error -->
            <p id="pesan"></p>

        </form>
    </div>


    <!-- ================= CHATBOT ================= -->

    <button id="chatButton" class="chat-button">💬</button>

    <div id="chatbot" class="chatbot">

        <div class="chat-header">
            <div>
                <strong>Asisten Pendaftaran</strong>
                <small>Online</small>
            </div>

            <button id="closeChat">×</button>
        </div>

        <div id="chatMessages" class="chat-messages">

            <div class="bot-message">
                Halo! 👋 Ada yang bisa saya bantu mengenai pendaftaran ekstrakurikuler?
            </div>

        </div>

        <div class="chat-input">
            <input
                type="text"
                id="chatInput"
                placeholder="Ketik pertanyaan..."
            >

            <button id="sendChat">➤</button>
        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
